# /etc/nginx/sites-available/lecturelive
# 使用方法: ln -s /etc/nginx/sites-available/lecturelive /etc/nginx/sites-enabled/

# ── 反代限流（http 上下文；本文件被 nginx.conf 的 http{} include）──────────
# 应用层限流按「IP / 登录用户 / 请求路径」分桶（src/lib/rateLimit.ts），但应用拿到的
# 客户端 IP 完全依赖下面的 proxy_set_header；反代这一层是攻击者换 IP / 绕过应用桶时
# 的兜底。三个维度相互独立：
#   per_ip  —— 单 IP 防滥用
#   global  —— 站点总预算，攻击者轮换 IP 时仍保护上游 Web/WS
#   auth    —— 登录/注册/找回密码，口令爆破与横向密码喷洒的入口，单独收紧
# 10m ≈ 16 万个 IP。
limit_req_zone  $binary_remote_addr zone=lecturelive_req_per_ip:10m rate=60r/s;
limit_req_zone  $binary_remote_addr zone=lecturelive_auth:10m       rate=2r/s;
limit_req_zone  $server_name        zone=lecturelive_req_global:1m  rate=600r/s;
limit_conn_zone $binary_remote_addr zone=lecturelive_conn_per_ip:10m;
limit_conn_zone $server_name        zone=lecturelive_conn_global:1m;
limit_req_status  429;
limit_conn_status 429;

upstream lecturelive_web {
    server 127.0.0.1:3000;
}

upstream lecturelive_ws {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    server_name your-domain.com;  # <-- 替换为你的域名

    # 如需 HTTPS，取消注释以下两行并配置证书
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    client_max_body_size 100M;

    # server 级默认预算。注意 nginx 的继承规则：任一 location 只要自己写了 limit_req，
    # 就会**整组覆盖**上层的 limit_req（limit_conn 同理）。因此下面 /api/auth/ 里
    # 把 per_ip / global 一并重述，不能只写 auth 那一条。
    limit_req  zone=lecturelive_req_per_ip burst=120  nodelay;
    limit_req  zone=lecturelive_req_global burst=1200 nodelay;
    limit_conn lecturelive_conn_per_ip 100;
    limit_conn lecturelive_conn_global 5000;

    # 登录/注册/找回密码：口令爆破与横向密码喷洒的入口，单独收紧
    location /api/auth/ {
        limit_req  zone=lecturelive_auth       burst=10   nodelay;
        limit_req  zone=lecturelive_req_per_ip burst=120  nodelay;
        limit_req  zone=lecturelive_req_global burst=1200 nodelay;
        limit_conn lecturelive_conn_per_ip 20;
        limit_conn lecturelive_conn_global 5000;

        proxy_pass http://lecturelive_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # ⚠️ 这三行必须是 proxy_set_header（**覆盖**），不能漏配、也不能改成
        # $proxy_add_x_forwarded_for：应用侧 TRUSTED_PROXY_HOPS=1 只剥一跳，
        # 漏配则这些头由客户端完全控制，可换出无限个限流桶并伪造审计来源。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js 应用
    location / {
        proxy_pass http://lecturelive_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 标准拓扑只有本机 nginx 一跳。覆盖客户端自带值，绝不能用
        # $proxy_add_x_forwarded_for 把攻击者伪造的链继续传给应用。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM 流式接口（/api/llm/chat、/api/llm/summarize 走 SSE）：
        # 拉长读超时避免默认 60s 截断为 502/504，关闭缓冲让 token 逐字到达客户端
        proxy_read_timeout 300;
        proxy_buffering off;
    }

    # WebSocket 服务
    #
    # 直播观众是长连接，且整间教室常常共用一个出口 IP（NAT）。这里显式放宽 per_ip
    # 连接数，否则 server 级的 100 会先于应用侧的 50/IP 限制把同一间教室掐掉。
    # WS 进程自己还有一层「每 IP ≤50 连接」，真正的上限以两者的较小值为准。
    location /socket.io/ {
        limit_conn lecturelive_conn_per_ip 400;
        limit_conn lecturelive_conn_global 5000;

        proxy_pass http://lecturelive_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # WS 握手同样按 TRUSTED_PROXY_HOPS=1 解析来源 IP：这两个头必须覆盖且一致，
        # 否则 resolveSocketClientIp 会 fail-closed 成 unknown，握手层直接拒连。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
