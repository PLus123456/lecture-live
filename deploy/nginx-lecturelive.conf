# /etc/nginx/sites-available/lecturelive
# 使用方法: ln -s /etc/nginx/sites-available/lecturelive /etc/nginx/sites-enabled/

# 本文件由 nginx.conf 的 http{} 引入，zone 必须定义在 server{} 之外。
# 两层预算相互独立：单 IP 防滥用，站点全局预算在攻击者轮换 IP 时仍保护上游 Web/WS。
limit_req_zone  $binary_remote_addr zone=lecturelive_req_per_ip:10m rate=60r/s;
limit_req_zone  $server_name        zone=lecturelive_req_global:1m rate=600r/s;
limit_conn_zone $binary_remote_addr zone=lecturelive_conn_per_ip:10m;
limit_conn_zone $server_name        zone=lecturelive_conn_global:1m;

upstream lecturelive_web {
    server 127.0.0.1:3000;
}

upstream lecturelive_ws {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    server_name your-domain.com;  # <-- 替换为你的域名

    # 如需 HTTPS，取消注释以下两行并配置证书
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    client_max_body_size 100M;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req zone=lecturelive_req_per_ip burst=120 nodelay;
    limit_req zone=lecturelive_req_global burst=1200 nodelay;
    limit_conn lecturelive_conn_per_ip 100;
    limit_conn lecturelive_conn_global 5000;

    # Next.js 应用
    location / {
        proxy_pass http://lecturelive_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 标准拓扑只有本机 nginx 一跳。覆盖客户端自带值，绝不能用
        # $proxy_add_x_forwarded_for 把攻击者伪造的链继续传给应用。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM 流式接口（/api/llm/chat、/api/llm/summarize 走 SSE）：
        # 拉长读超时避免默认 60s 截断为 502/504，关闭缓冲让 token 逐字到达客户端
        proxy_read_timeout 300;
        proxy_buffering off;
    }

    # WebSocket 服务
    location /socket.io/ {
        proxy_pass http://lecturelive_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
