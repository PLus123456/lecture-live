# /etc/nginx/sites-available/lecturelive
# 使用方法: ln -s /etc/nginx/sites-available/lecturelive /etc/nginx/sites-enabled/

# ── 聚合限流（H7 兜底）──────────────────────────────────────────────
# 应用层限流按「IP / 登录用户 / 请求路径」分桶（src/lib/rateLimit.ts）；
# 但 TRUSTED_PROXY 未开启时应用拿不到真实 IP，匿名者的**总量**只能靠反代来压。
# 这两个 zone 必须在 http 上下文（本文件被 include 进 http 块），10m ≈ 16 万个 IP。
limit_req_zone $binary_remote_addr zone=lecturelive_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=lecturelive_auth:10m rate=2r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=lecturelive_conn:10m;

upstream lecturelive_web {
    server 127.0.0.1:3000;
}

upstream lecturelive_ws {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    server_name your-domain.com;  # <-- 替换为你的域名

    # 如需 HTTPS，取消注释以下两行并配置证书
    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    client_max_body_size 100M;

    # 登录/注册/找回密码：口令爆破与横向密码喷洒的入口，单独收紧
    location /api/auth/ {
        limit_req zone=lecturelive_auth burst=10 nodelay;
        limit_conn lecturelive_conn 20;

        proxy_pass http://lecturelive_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # ⚠️ 这两行必须是 proxy_set_header（覆盖），不能漏配：
        # 应用侧 TRUSTED_PROXY=true 时会信任它们取真实客户端 IP，
        # 漏配则该头由客户端完全控制，可换出无限个限流桶（M22）。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js 应用
    location / {
        limit_req zone=lecturelive_api burst=40 nodelay;

        proxy_pass http://lecturelive_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM 流式接口（/api/llm/chat、/api/llm/summarize 走 SSE）：
        # 拉长读超时避免默认 60s 截断为 502/504，关闭缓冲让 token 逐字到达客户端
        proxy_read_timeout 300;
        proxy_buffering off;
    }

    # WebSocket 服务
    location /socket.io/ {
        proxy_pass http://lecturelive_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
