version: '3.8'
services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3001:3001"     # WebSocket server for live share
    env_file: .env.local
    environment:
      # 容器内部必须监听所有接口，宿主暴露面仍由上面的 127.0.0.1 端口绑定收口。
      # Docker 会自动注入容器 ID 形式的 HOSTNAME，不能让 Next.js 误绑定该名字。
      HOSTNAME: "0.0.0.0"
      WS_HOST: "0.0.0.0"
      DATABASE_URL: mysql://lecturelive:${DB_PASSWORD_ENCODED}@db:3306/lecturelive
      # 用 URL 编码后的口令拼 URL（口令含 '/'、'@'、':' 等时裸拼会让 ioredis 的 url 解析报错）；
      # redis 服务自身的 --requirepass / healthcheck 仍用未编码的 REDIS_PASSWORD。
      REDIS_URL: redis://:${REDIS_PASSWORD_ENCODED}@redis:6379
      # 标准部署由宿主本机 nginx 反代到 loopback 发布端口，固定一跳；额外 CDN/LB
      # 必须在宿主 .env 显式覆盖 hop 与 CIDR，非法多跳配置会让 WS 启动失败。
      TRUSTED_PROXY_HOPS: "${TRUSTED_PROXY_HOPS:-1}"
      # Docker NAT 下宿主 nginx 在容器内通常表现为 bridge gateway (172.16/12)。端口只
      # 发布到宿主 loopback；若你的 Docker 地址池不同，请显式改成实际 gateway CIDR。
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12}"
    # 录音/转录/摘要/报告/聊天图片/图标/异步分片等都写入 /app/data（未配 Cloudreve 时仅存本地）；
    # 不挂卷则容器重建即丢失全部用户数据、DB 中 local: 引用全部悬空。
    volumes:
      - appdata:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "scripts/check-readiness.mjs"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 45s
    restart: unless-stopped

  db:
    image: mysql:8.4
    command: --mysql-native-password=ON
    environment:
      MYSQL_DATABASE: lecturelive
      MYSQL_USER: lecturelive
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ulecturelive", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # P4-4：必须显式配 maxmemory + 逐出策略。裸 redis-server 是「无上限 + noeviction」：
    # 这一个实例同时扛着 API 响应缓存、限流计数、鉴权黑名单，缓存把内存撑爆后写入直接报错，
    # 限流与 token 吊销一起退化（限流回落进程内存 = 多实例下形同虚设）。
    # allkeys-lru：所有键都可被逐出，且全部键都带 TTL（缓存 30s / 限流按窗口 / 黑名单按 token 寿命），
    # 逐出的是最久未用的那批，压力下系统降级为「缓存未命中」而不是「写入失败」。
    command: >-
      redis-server --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cloudreve:
    # 钉死具体版本，避免 latest 在重建时悄悄拉到不兼容的大版本
    image: cloudreve/cloudreve:4.16.0
    ports:
      - "127.0.0.1:5212:5212"
    volumes:
      - cloudreve_data:/cloudreve/uploads
      - cloudreve_config:/cloudreve/config
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  appdata:
  mysqldata:
  redisdata:
  cloudreve_data:
  cloudreve_config:
